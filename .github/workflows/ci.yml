name: PacMan CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Stage 1: PLAN ─────────────────────────────────────────────────────────
  plan:
    name: "Plan — Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 pyflakes

      - name: Run flake8 (style + errors)
        run: |
          flake8 backend/ frontend/ main.py \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count --statistics

      - name: Check imports (pyflakes)
        run: pyflakes backend/ frontend/ main.py || true

  # ── Stage 2: CODE ─────────────────────────────────────────────────────────
  code:
    name: "Code — Unit Tests"
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          # pygame headless for tests
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
          pip install pygame

      - name: Run unit tests with coverage
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=backend \
            --cov-report=term-missing \
            --cov-fail-under=70

  # ── Stage 3: BUILD ────────────────────────────────────────────────────────
  build:
    name: "Build — Package Artifact"
    runs-on: ubuntu-latest
    needs: code
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build wheel setuptools

      - name: Verify project structure
        run: |
          echo "=== Project layout ==="
          find . -name "*.py" | grep -v __pycache__ | sort
          echo ""
          echo "=== Entry point check ==="
          python -c "
          import sys, os
          sys.path.insert(0,'.')
          from backend.utils.config import GameConfig, DIFFICULTY_PRESETS
          from backend.core.game_map import GameMap, Vec2
          from backend.core.score_manager import ScoreManager
          cfg = GameConfig()
          gm  = GameMap(1)
          sm  = ScoreManager()
          print('All imports OK')
          print(f'Map size: {gm.cols}x{gm.rows}, dots: {gm.total_dots}')
          print(f'Config FPS: {cfg.fps}')
          "

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-source
          path: |
            backend/
            frontend/
            main.py
            requirements.txt
          retention-days: 7
