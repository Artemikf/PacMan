name: PacMan CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Stage 1: TEST ──────────────────────────────────────────────────────────
  test:
    name: "Test — Pytest + HTML Report"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest with HTML report
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pytest tests/ -v \
            --tb=short \
            --html=reports/test_report.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test_report.html
          retention-days: 14

  # ── Stage 2: LINT ─────────────────────────────────────────────────────────
  lint:
    name: "Lint — Flake8 + HTML Report"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install flake8 flake8-html

      - name: Run Flake8 with HTML report
        run: |
          mkdir -p reports
          flake8 backend/ frontend/ main.py \
            --max-line-length=120 \
            --exclude=__pycache__,.venv \
            --format=html \
            --htmldir=reports/flake8_report \
            --statistics || true
          flake8 backend/ frontend/ main.py \
            --max-line-length=120 \
            --exclude=__pycache__,.venv \
            --count --statistics

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: reports/flake8_report/
          retention-days: 14

  # ── Stage 3: BUILD ────────────────────────────────────────────────────────
  build:
    name: "Build — Verify & Package"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "
          from backend.utils.config import GameConfig
          from backend.core.game_map import GameMap, Vec2
          from backend.core.score_manager import ScoreManager
          from backend.core.game_engine import GameEngine
          from backend.entities.ghost import Ghost, GhostPersonality
          from backend.entities.pacman import PacMan
          print('All imports OK')
          gm = GameMap(1)
          print(f'Map: {gm.cols}x{gm.rows}, dots: {gm.total_dots}')
          "

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: pacman-source
          path: |
            backend/
            frontend/
            main.py
            requirements.txt
          retention-days: 7
